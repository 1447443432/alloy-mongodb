services:
  alloy-vlogs-mongodb:
    image: registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-alloy-vlogs-mongodb-amd64:1.0.0
    container_name: alloy-vlogs-mongodb
    restart: always
    environment:
      # victorialogs 服务地址，需根据实际情况修改
      VICTORIALOGS_IP: 10.206.0.5
      # victorialogs 认证用户，需根据实际情况修改
      VICTORIALOGS_USERNAME: myuser
      # victorialogs 认证密码，需根据实际情况修改
      VICTORIALOGS_PASSWORD: mypassword
      # victorialogs 服务端口，默认 9428
      VICTORIALOGS_PORT: 9428
      # MongoDB 所在服务器 IP，用于生成 mongodb-<IP> 唯一标识
      MONGODB_SERVER_IP: 10.206.0.8
    volumes:
      - /data/logs/mongodb/mongodb.log:/data/logs/mongodb/mongodb.log:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/machine-id:/host/etc/machine-id:ro
      - /data/alloy-data:/usr/local/alloy-vlogs/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
